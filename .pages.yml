# Pages CMS, https://pagescms.org/docs/
# Edit this site at https://app.pagescms.org after installing the GitHub app.

media:
  # Default media folder for in-body images. Goes through Astro's image()
  # pipeline. Written as relative paths from src/content/posts.
  - name: content
    label: Content images
    input: src/assets/img
    output: ../../assets/img
    categories: [image]

  # Cover images go through Astro's image() pipeline for AVIF/WebP +
  # responsive widths. Written as relative paths from src/content/posts
  # (../../assets/covers/foo.webp) so image() can resolve them.
  - name: covers
    label: Post covers
    input: src/assets/covers
    output: ../../assets/covers
    categories: [image]

  - name: projectImages
    label: Project images
    input: src/assets/projects
    output: ../../assets/projects
    categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      fields: [title, pubDate, draft, tags]
      primary: title
      sort: [pubDate, title, draft]
      default:
        sort: pubDate
        order: desc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, required: true, options: { maxlength: 300 } }
      - { name: pubDate, label: Published, type: date, required: true }
      - { name: updatedDate, label: Updated, type: date }
      - {
          name: draft,
          label: Draft,
          type: boolean,
          default: true,
          description: "Keep enabled while writing. Turn off to publish on the next site build.",
        }
      - { name: tags, type: string, list: true }
      - name: cover
        label: Cover image
        type: object
        fields:
          - { name: src, label: Image, type: image, options: { media: covers } }
          - { name: alt, label: Alt text, type: string, required: true }
          - { name: caption, type: string }
      - { name: body, label: Body, type: rich-text, options: { media: content, switcher: true } }

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, pinned, archived, order]
      primary: title
      sort: [order, title, pinned, archived]
      default:
        sort: order
        order: asc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, required: true }
      - { name: category, label: Project type, type: string, required: true }
      - name: cover
        label: Project image
        type: object
        fields:
          - { name: src, label: Image, type: image, options: { media: projectImages } }
          - { name: alt, label: Image description, type: string, required: true }
      - name: imageStyle
        label: Image presentation
        type: select
        default: screenshot
        options:
          values:
            - { label: Screenshot, value: screenshot }
            - { label: App icon, value: icon }
      - name: repo
        label: Repository URL
        type: string
        pattern:
          regex: "^https?://"
          message: Must start with http(s)://
      - name: homepage
        label: Live URL
        type: string
        pattern:
          regex: "^https?://"
          message: Must start with http(s)://
      - { name: stack, type: string, list: true }
      - { name: pinned, type: boolean, default: false }
      - { name: archived, type: boolean, default: false }
      - { name: order, type: number, default: 0 }
      - { name: body, label: Body, type: rich-text, options: { media: content, switcher: true } }

  - name: about
    label: About page
    type: file
    path: src/content/pages/about.mdx
    format: yaml-frontmatter
    fields:
      - {
          name: title,
          type: string,
          required: true,
          description: "Text before the optional accented title ending.",
        }
      - { name: titleAccent, label: Title accent, type: string }
      - { name: description, type: text, description: "Used for the page <meta description>." }
      - { name: lede, type: text }
      - { name: body, label: Body, type: rich-text, options: { media: content, switcher: true } }

  - name: home
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - { name: headline, label: Main heading, type: string, required: true }
      - {
          name: headlineAccent,
          label: Heading accent,
          type: string,
          description: "Accent-coloured ending of the heading, such as a name.",
        }
      - { name: introduction, label: Introduction, type: text, required: true }

settings:
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"
      rename: "content: rename {oldFilename} → {newFilename}"
