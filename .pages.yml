# Pages CMS, https://pagescms.org/docs/
# Edit this site at https://app.pagescms.org after installing the GitHub app.

media:
  # Default media folder for in-body images. Goes through Astro's image()
  # pipeline. Written as relative paths from src/content/posts.
  - name: content
    label: Content images
    input: src/assets/img
    output: ../../assets/img
    categories: [image]

  # Cover images go through Astro's image() pipeline for AVIF/WebP +
  # responsive widths. Written as relative paths from src/content/posts
  # (../../assets/covers/foo.webp) so image() can resolve them.
  - name: covers
    label: Post covers
    input: src/assets/covers
    output: ../../assets/covers
    categories: [image]

  - name: projectImages
    label: Project images
    input: src/assets/projects
    output: ../../assets/projects
    categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      fields: [title, pubDate, draft, tags]
      primary: title
      sort: [pubDate, title, draft]
      search: [title, description, tags]
      default:
        sort: pubDate
        order: desc
    fields:
      - { name: title, type: string, required: true, options: { maxlength: 120 } }
      - name: description
        label: Summary
        type: text
        required: true
        description: "Shown in post lists, search results and link previews. Aim for one or two sentences."
        options: { maxlength: 170 }
      - name: pubDate
        label: Published
        type: date
        required: true
        description: "Posts dated in the future stay hidden until a build runs after that date."
        options: { format: yyyy-MM-dd }
      - name: updatedDate
        label: Updated
        type: date
        default: ""
        description: "Only set this after a meaningful revision."
        options: { format: yyyy-MM-dd }
      - {
          name: draft,
          label: Draft,
          type: boolean,
          default: true,
          description: "Keep enabled while writing. Turn off to publish on the next site build.",
        }
      - name: tags
        type: string
        list: true
        description: "Lowercase, reuse existing tags where possible (e.g. automotive, career)."
      - name: cover
        label: Cover image
        type: object
        description: "Optional. Shown at the top of the post."
        fields:
          - { name: src, label: Image, type: image, required: true, options: { media: covers } }
          - name: alt
            label: Image description
            type: string
            required: true
            description: "Describe what the image shows, for screen readers."
          - { name: caption, type: string }
      - { name: body, label: Body, type: rich-text, options: { media: content, switcher: true } }

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    operations:
      rename: false
    view:
      fields: [title, category, pinned, archived, order]
      primary: title
      sort: [order, title, pinned, archived]
      search: [title, description, stack]
      default:
        sort: order
        order: asc
    fields:
      - { name: title, type: string, required: true, options: { maxlength: 80 } }
      - name: description
        type: text
        required: true
        description: "One sentence. Shown on project cards and as the page summary."
        options: { maxlength: 160 }
      - name: category
        label: Project type
        type: string
        required: true
        description: "Shown above the title on cards, e.g. macOS application."
      - name: cover
        label: Project image
        type: object
        description: "Optional. Shown on the project page only; cards are text."
        fields:
          - {
              name: src,
              label: Image,
              type: image,
              required: true,
              options: { media: projectImages },
            }
          - { name: alt, label: Image description, type: string, required: true }
      - name: imageStyle
        label: Image presentation
        type: select
        default: screenshot
        description: "App icon shows the image small and centred; Screenshot fills the frame."
        options:
          values:
            - { label: Screenshot, value: screenshot }
            - { label: App icon, value: icon }
      - name: repo
        label: Repository URL
        type: string
        pattern:
          regex: "^https?://"
          message: Must start with http(s)://
      - name: homepage
        label: Live URL
        type: string
        pattern:
          regex: "^https?://"
          message: Must start with http(s)://
      - { name: stack, label: Built with, type: string, list: true }
      - name: pinned
        label: Show on homepage
        type: boolean
        default: false
        description: "Up to two pinned projects appear on the homepage, by Order."
      - name: archived
        type: boolean
        default: false
        description: "Marks the project as no longer maintained."
      - name: order
        type: number
        default: 0
        description: "Lower numbers come first."
        options: { min: 0 }
      - { name: body, label: Body, type: rich-text, options: { media: content, switcher: true } }

  - name: about
    label: About page
    type: file
    path: src/content/pages/about.mdx
    format: yaml-frontmatter
    fields:
      - { name: title, type: string, required: true, description: "Page heading, e.g. About." }
      - {
          name: description,
          type: text,
          description: "Shown in search results and link previews.",
          options: { maxlength: 170 },
        }
      - { name: lede, label: Introduction, type: text }
      - { name: body, label: Body, type: rich-text, options: { media: content, switcher: true } }

  - name: home
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - { name: headline, label: Main heading, type: string, required: true }
      - {
          name: headlineAccent,
          label: Heading accent,
          type: string,
          description: "Accent-coloured ending of the heading, such as a name.",
        }
      - { name: introduction, label: Introduction, type: text, required: true }

settings:
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"
      rename: "content: rename {oldFilename} → {newFilename}"
